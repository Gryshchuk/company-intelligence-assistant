[project]
name = "company-intel"
version = "0.1.0"
requires-python = ">=3.11,<4.0"
dependencies = [
    "deepagents>=0.6.1",
    "langchain>=1.3",
    "langchain-openai>=1.2",
    "langgraph>=1.0",
    "openai>=2.0",
    "streamlit>=1.49",
    "lancedb>=0.30",
    "pyarrow>=15",
    "tavily-python>=0.7",
    "wikipedia-api>=0.8",
    "trafilatura>=2.0",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "tiktoken>=0.13",
    "pydantic>=2.7",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"company_intel.skills" = ["**/SKILL.md"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-ignore = ["E203"]
